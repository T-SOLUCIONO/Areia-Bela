# Construye la imagen de la web en Cloud Build.
#
# Separada de la del API a propósito, y no por orden: `NEXT_PUBLIC_API_URL` se
# compila **dentro del bundle del navegador**, así que hay que conocer la URL
# del API antes de construir esto. Primero se despliega el API, se lee su URL,
# y con ella se construye la web.
#
#   API_URL=$(gcloud run services describe areia-bela-api \
#     --region us-central1 --format='value(status.url)')
#
#   gcloud builds submit --config cloudbuild.web.yaml \
#     --substitutions=_REGION=us-central1,_TAG=1,_API_URL=$API_URL,_SITE_URL=$API_URL
#
steps:
  - name: gcr.io/cloud-builders/docker
    # Los Dockerfile usan `RUN --mount=type=cache`, que es sintaxis de
    # BuildKit. El constructor clásico no la entiende y aborta con
    # "the --mount option requires BuildKit".
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --file=apps/web/Dockerfile
      - --build-arg=NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:${_TAG}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:latest

substitutions:
  _REGION: us-central1
  _REPO: areia-bela
  _TAG: latest
  # Sin valor por defecto útil a propósito: construir la web apuntando a
  # localhost produce una imagen que parece correcta y no puede hablar con
  # nada. Mejor que falle el build.
  _API_URL: ''
  _SITE_URL: ''

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
