services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: areia_bela
      POSTGRES_PASSWORD: areia_bela_dev
      POSTGRES_DB: areia_bela
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U areia_bela']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
