# Runs what a human was running by hand until now.
#
# Every one of these four caught something real during Fase 7: typecheck caught
# a Prisma Decimal being handed to `.toFixed()`, lint caught hooks placed after
# an early return, and the tests caught a `!== null` that should have been a
# truthiness check. None of them are ceremony.
name: CI

on:
  # Every branch, not just main. This project is worked on by pushing to
  # feature branches, and a check that only runs once a pull request exists is
  # a check that arrives after the mistake has been built on top of. The cost
  # is a duplicate run on branches that do open a pull request.
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Prisma needs a URL to generate a client; it never connects here, since
      # every test uses mocks. A real database belongs with the E2E job.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/areia_bela_ci
      # `next build` reads it through turbo's env allowlist. Empty is correct:
      # the code refuses to open checkout without a key rather than guessing.
      STRIPE_SECRET_KEY: ''
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Not in a postinstall hook: the client is a build artefact, and the repo
      # deliberately keeps `pnpm install` from touching the schema.
      - name: Generate the Prisma client
        run: pnpm --filter @areia-bela/api prisma:generate

      # Ordered cheapest-first, so a formatting slip fails in seconds instead
      # of after a Next build.
      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Kept separate and non-blocking. A migration that does not apply to an empty
  # database is a migration that will not apply in production either, and that
  # is worth knowing — but it must not stop a docs-only commit from merging.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: areia_bela_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/areia_bela_ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply every migration from scratch
        run: pnpm --filter @areia-bela/api prisma:deploy

      # The seed is supposed to be idempotent (CLAUDE.md). Running it twice is
      # the only way to find out.
      #
      # The password is generated here and dies with the runner. The seed
      # refuses to invent one — deliberately, so no environment ends up with a
      # default admin — and hardcoding a throwaway in a workflow is how a
      # throwaway becomes a habit.
      - name: Seed, twice
        run: |
          export ADMIN_SEED_PASSWORD="$(openssl rand -base64 24)"
          pnpm --filter @areia-bela/api seed
          pnpm --filter @areia-bela/api seed
          pnpm --filter @areia-bela/api seed:taxes
          pnpm --filter @areia-bela/api seed:taxes

  # The booking flow, driven through a browser against the real API and a real
  # database. Nothing is stubbed: every bug this catches lived in a seam, and a
  # mocked API has no seams.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: areia_bela_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/areia_bela_e2e
      NEXT_PUBLIC_API_URL: http://localhost:3001
      CORS_ORIGINS: http://localhost:3000
      E2E_API_URL: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: '1'
      # No Stripe key. The suite asserts both outcomes — a hold that opens a
      # payment keeps its dates, and one that cannot must give them straight
      # back — so it is honest without credentials rather than skipped.
      STRIPE_SECRET_KEY: ''
      # Long enough to be worth nothing, and gone with the runner.
      JWT_SECRET: e2e-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only Chromium. Three engines triple the minutes to re-test the same
      # server behaviour; a rendering difference is not what this suite is for.
      - name: Install Chromium
        run: pnpm --filter @areia-bela/web exec playwright install --with-deps chromium

      - name: Prepare the database
        run: |
          export ADMIN_SEED_PASSWORD="$(openssl rand -base64 24)"
          pnpm --filter @areia-bela/api prisma:deploy
          pnpm --filter @areia-bela/api seed
          pnpm --filter @areia-bela/api seed:taxes

      - name: Start the API
        run: |
          pnpm --filter @areia-bela/api start &
          npx --yes wait-on http://localhost:3001/properties/areia-bela --timeout 90000

      - name: Run the booking flow
        run: pnpm --filter @areia-bela/web test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
